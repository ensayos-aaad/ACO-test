# Ensayo por defecto: el mundo "L" del plano, 6 agentes y la madre como pista de baile.
# Los valores vienen de DECISIONES-PRUEBA.md (rondas 1 a 3). Todas las claves son opcionales: la que
# falte toma el valor del código, que es el que se muestra aquí salvo en limite, salida_cada y viajes
# (en el código: 2000, 0 y 1; aquí se usan 6000, 1 y 10 por la decisión J7).

semilla: 2026            # define el mundo (inicio y meta), las agentes y el canal

mundo:
  escenario: L           # L | aleatorio | puente_doble | personalizado
  # Con personalizado el mundo se escribe a mano (no usa la semilla ni distancia_minima), p. ej.:
  #   ancho: 5
  #   alto: 4
  #   obstaculos: [[2, 0], [2, 1], [2, 2]]
  #   inicio: [0, 0]
  #   meta: [4, 0]
  distancia_minima: 4    # movimientos mínimos de la ruta óptima entre inicio y meta (I13)
  tau_max: 1.0           # tope de feromona por celda; los 16 niveles percibidos van de 0 a este valor
  unidad_deposito: 1/255 # feromona que suma cada unidad del campo "deposito" de una ACCION

ensayo:
  n_agentes: 6           # tamaño de la colonia (C4)
  limite: 6000           # máximo de ticks, verificación incluida (I11; 6000 por los 10 viajes, J7)
  rho: 0.01              # evaporación por tick (I3)
  salida_cada: 1         # ticks entre la salida de una agente y la siguiente; 0 = todas juntas (J1, J7)

agente:
  alpha: 2.0             # exponente de la feromona (I1)
  k: 1.0                 # atractivo de una celda sin feromona (I2)
  theta: 8.0             # umbral de cambio de rol exploradora/explotadora (I8)
  K: 64                  # memoria: movimientos de su ruta (I9)
  deposito: calidad      # calidad (255 / largo de la ruta) | constante (I6)
  deposito_valor: 1      # unidades por celda en el modo constante
  delta_t: 10            # cada cuántos ticks informa su ESTADO a la madre
  viajes: 10             # idas y vueltas con depósito antes de asentarse (J2, J7)

madre:
  modo: pista_de_baile   # ausente | pista_de_baile | rescate | difusion (F1)
  delta_t: 10            # ticks entre dos actuaciones (I15)
  memoria: 64            # presupuesto de memoria en bytes (F3, I15)
  umbral_rescate: 0.5    # rezagada = experiencia menor que esta fracción del promedio (I14)
  rutas_por_anuncio: 3   # rutas que anuncia cada RECLUTA (máximo 3)

canal:
  radio: 1               # alcance de los mensajes entre agentes, en celdas (I15)
  p_perdida: 0.0         # probabilidad de perder un mensaje no garantizado
  retardo: [0, 0]        # retardo mínimo y máximo, en ticks
  formato: binario       # binario | json (define los bytes que se cuentan)
